version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep the V2 beta pin until migration to @opencode/plugin. Stable
      # versions of this package don't export the V2 promise SDK.
      - dependency-name: "@opencode-ai/plugin"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
